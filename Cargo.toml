[package]
name = "acom-controller"
version = "1.0.8"
edition = "2024"
description = "Modern remote controller for ACOM solid-state amplifiers"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.37", features = ["persistence"] }
egui_plot = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
serialport = "4.10"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
tracing = "0.1"
ureq = "3"
tracing-subscriber = "0.3"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
